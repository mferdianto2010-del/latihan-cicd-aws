AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless image file API - HTTP API, Lambda, S3, Aurora Serverless v2

Parameters:
  ProjectName:
    Type: String
    Default: workshop-api
  LambdaExecutionRoleArn:
    Type: String
  DbUsername:
    Type: String
    Default: appuser
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9!@#$%^&*()_+=-]{8,64}$'
  DbName:
    Type: String
    Default: appdb
  ImagesBucketName:
    Type: String
  AllowedOrigins:
    Type: String
    Default: '*'

Resources:
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ImagesBucketName
      ### ADD MISSING CONFIG BELOW ###
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DbSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      SecretString: !Sub '{"username":"${DbUsername}","password":"${DbPassword}"}'

  DbCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Sub '${AWS::StackName}-cluster'
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DatabaseName: !Ref DbName
      DeletionProtection: false
      ### ADD MISSING CONFIG BELOW ###
      EnableHttpEndpoint: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 2

  ListFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-list'
      Runtime: nodejs22.x
      Handler: handlers/list.handler
      Role: !Ref LambdaExecutionRoleArn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
          DB_CLUSTER_ARN: !GetAtt DbCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbSecret
          DB_NAME: !Ref DbName
      Code:
        ZipFile: "exports.handler = async () => ({ statusCode: 500, body: JSON.stringify({ error: 'code not deployed' }) });"

  UploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-upload'
      Runtime: nodejs22.x
      Handler: handlers/upload.handler
      Role: !Ref LambdaExecutionRoleArn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
          DB_CLUSTER_ARN: !GetAtt DbCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbSecret
          DB_NAME: !Ref DbName
      Code:
        ZipFile: "exports.handler = async () => ({ statusCode: 500, body: JSON.stringify({ error: 'code not deployed' }) });"

  DeleteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-delete'
      Runtime: nodejs22.x
      Handler: handlers/delete.handler
      Role: !Ref LambdaExecutionRoleArn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
          DB_CLUSTER_ARN: !GetAtt DbCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbSecret
          DB_NAME: !Ref DbName
      Code:
        ZipFile: "exports.handler = async () => ({ statusCode: 500, body: JSON.stringify({ error: 'code not deployed' }) });"

  ListFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ListFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  UploadFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UploadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  DeleteFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DeleteFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub '${ProjectName}-key'
      Enabled: true

  ApiKeyAuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-authorizer'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !Ref LambdaExecutionRoleArn
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          API_KEY_ID: !Ref ApiKey
      Code:
        ZipFile: |
          const { APIGatewayClient, GetApiKeyCommand } = require('@aws-sdk/client-api-gateway');
          const client = new APIGatewayClient({});
          let cachedKey;
          exports.handler = async (event) => {
            const provided = event.headers?.['x-api-key'] || event.headers?.['X-Api-Key'];
            if (!provided) return { isAuthorized: false };
            if (!cachedKey) {
              const res = await client.send(new GetApiKeyCommand({ apiKey: process.env.API_KEY_ID, includeValue: true }));
              cachedKey = res.value;
            }
            return { isAuthorized: provided === cachedKey };
          };

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      ProtocolType: HTTP
      ### ADD MISSING CONFIG BELOW ###
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigins
        AllowHeaders:
          - content-type
          - x-api-key
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS

  ApiKeyAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: REQUEST
      AuthorizerPayloadFormatVersion: '2.0'
      EnableSimpleResponses: true
      Name: ApiKeyAuthorizer
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiKeyAuthorizerFunction.Arn}/invocations'
      IdentitySource:
        - '$request.header.x-api-key'
      AuthorizerResultTtlInSeconds: 300

  AuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiKeyAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/authorizers/${ApiKeyAuthorizer}'

  ListIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ListFunction.Arn
      PayloadFormatVersion: '2.0'

  UploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt UploadFunction.Arn
      PayloadFormatVersion: '2.0'

  DeleteIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DeleteFunction.Arn
      PayloadFormatVersion: '2.0'

  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /files
      Target: !Sub 'integrations/${ListIntegration}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiKeyAuthorizer

  GetFileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /files/{id}
      Target: !Sub 'integrations/${ListIntegration}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiKeyAuthorizer

  UploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /files
      Target: !Sub 'integrations/${UploadIntegration}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiKeyAuthorizer

  DeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: DELETE /files/{id}
      Target: !Sub 'integrations/${DeleteIntegration}'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiKeyAuthorizer

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  ImagesBucketName:
    Value: !Ref ImagesBucket
  DbClusterArn:
    Value: !GetAtt DbCluster.DBClusterArn
  DbSecretArn:
    Value: !Ref DbSecret
  ApiKeyId:
    Value: !Ref ApiKey