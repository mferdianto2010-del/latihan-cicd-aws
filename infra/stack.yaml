AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless image file API - HTTP API, Lambda, S3, Aurora Serverless v2

Parameters:
  ProjectName:
    Type: String
    Default: workshop-api
  LambdaExecutionRoleArn:
    Type: String
  DbUsername:
    Type: String
    Default: appuser
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: '^[A-Za-z0-9!@#$%^&*()_+=-]{8,64}$'
  DbName:
    Type: String
    Default: appdb
  ImagesBucketName:
    Type: String
  AllowedOrigins:
    Type: String
    Default: '*'

Resources:
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ImagesBucketName
      ### ADD MISSING CONFIG BELOW ###

  DbSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      SecretString: !Sub '{"username":"${DbUsername}","password":"${DbPassword}"}'

  DbCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Sub '${ProjectName}-cluster'
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DatabaseName: !Ref DbName
      DeletionProtection: false
      ### ADD MISSING CONFIG BELOW ###

  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref DbCluster
      DBInstanceIdentifier: !Sub '${ProjectName}-instance'
      DBInstanceClass: <fill-serverless-instance-class>

  ListFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-list'
      Runtime: nodejs22.x
      Handler: handlers/list.handler
      Role: !Ref LambdaExecutionRoleArn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
          DB_CLUSTER_ARN: !GetAtt DbCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbSecret
          DB_NAME: !Ref DbName
      Code:
        ZipFile: "exports.handler = async () => ({ statusCode: 500, body: JSON.stringify({ error: 'code not deployed' }) });"

  UploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-upload'
      Runtime: nodejs22.x
      Handler: handlers/upload.handler
      Role: !Ref LambdaExecutionRoleArn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
          DB_CLUSTER_ARN: !GetAtt DbCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbSecret
          DB_NAME: !Ref DbName
      Code:
        ZipFile: "exports.handler = async () => ({ statusCode: 500, body: JSON.stringify({ error: 'code not deployed' }) });"

  DeleteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-delete'
      Runtime: nodejs22.x
      Handler: handlers/delete.handler
      Role: !Ref LambdaExecutionRoleArn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
          DB_CLUSTER_ARN: !GetAtt DbCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbSecret
          DB_NAME: !Ref DbName
      Code:
        ZipFile: "exports.handler = async () => ({ statusCode: 500, body: JSON.stringify({ error: 'code not deployed' }) });"

  ListFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ListFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  UploadFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UploadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  DeleteFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DeleteFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      ProtocolType: HTTP
      ### ADD MISSING CONFIG BELOW ###

  ListIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ListFunction.Arn
      PayloadFormatVersion: '2.0'

  UploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt UploadFunction.Arn
      PayloadFormatVersion: '2.0'

  DeleteIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DeleteFunction.Arn
      PayloadFormatVersion: '2.0'

  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /files
      Target: !Sub 'integrations/${ListIntegration}'
      AuthorizationType: NONE
      ApiKeyRequired: <fill-true-or-false>

  GetFileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /files/{id}
      Target: !Sub 'integrations/${ListIntegration}'
      AuthorizationType: NONE
      ApiKeyRequired: <fill-true-or-false>

  UploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /files
      Target: !Sub 'integrations/${UploadIntegration}'
      AuthorizationType: NONE
      ApiKeyRequired: <fill-true-or-false>

  DeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: DELETE /files/{id}
      Target: !Sub 'integrations/${DeleteIntegration}'
      AuthorizationType: NONE
      ApiKeyRequired: <fill-true-or-false>

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub '${ProjectName}-key'
      Enabled: true

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub '${ProjectName}-usage-plan'
      Throttle:
        BurstLimit: <fill-burst-limit>
        RateLimit: <fill-rate-limit>
      ### ADD MISSING CONFIG BELOW ###

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  ImagesBucketName:
    Value: !Ref ImagesBucket
  DbClusterArn:
    Value: !GetAtt DbCluster.DBClusterArn
  DbSecretArn:
    Value: !Ref DbSecret
  ApiKeyId:
    Value: !Ref ApiKey
