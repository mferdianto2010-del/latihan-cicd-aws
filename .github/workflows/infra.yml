name: infra

on:
  workflow_dispatch:
  push:
    tags:
      - "release/v*"

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      STACK_NAME: workshop-api-wildan
      AWS_REGION: us-east-1
      PROJECT_NAME: workshop-api
      IMAGES_BUCKET_NAME: workshop-api-images-wildan-2026
      ALLOWED_ORIGINS: http://example.com
      LAMBDA_ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: install dependencies
        run: npm --prefix src ci

      - name: deploy stack
        run: |
          ### Add missing command below ###
          # aws cli to deploy cloudformation. 
          # Don't forget to use parameter for project name, lambda, db password, image bucket, and allowed origins
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name "$STACK_NAME" \
            --role-arn "$LAMBDA_ROLE_ARN" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ProjectName="$PROJECT_NAME" \
              LambdaExecutionRoleArn="$LAMBDA_ROLE_ARN" \
              DbPassword="$DB_PASSWORD" \
              ImagesBucketName="$IMAGES_BUCKET_NAME" \
              AllowedOrigins="$ALLOWED_ORIGINS"

      - name: read stack outputs
        run: |
          ### ADD MISSING CONFIG BELOW ###
          # next steps read ApiUrl, ImagesBucketName, DbClusterArn, DbSecretArn, ApiKeyId and DB_CLUSTER_ARN, DB_SECRET_ARN, DB_NAME
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs" --output json)
          ApiUrl=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ApiUrl") | .OutputValue')
          ImagesBucketName=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ImagesBucketName") | .OutputValue')
          DbClusterArn=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="DbClusterArn") | .OutputValue')
          DbSecretArn=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="DbSecretArn") | .OutputValue')
          ApiKeyId=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="ApiKeyId") | .OutputValue')

          {
            echo "ApiUrl=$ApiUrl"
            echo "ImagesBucketName=$ImagesBucketName"
            echo "DbClusterArn=$DbClusterArn"
            echo "DbSecretArn=$DbSecretArn"
            echo "ApiKeyId=$ApiKeyId"
            echo "DB_CLUSTER_ARN=$DbClusterArn"
            echo "DB_SECRET_ARN=$DbSecretArn"
            echo "DB_NAME=appdb"
          } >> "$GITHUB_ENV"

      - name: migrate database
        run: node src/scripts/migrate.js

      - name: summary
        run: |
          echo "### Infrastructure deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- ApiUrl: $ApiUrl" >> "$GITHUB_STEP_SUMMARY"
          echo "- ImagesBucketName: $ImagesBucketName" >> "$GITHUB_STEP_SUMMARY"
          echo "- DbClusterArn: $DbClusterArn" >> "$GITHUB_STEP_SUMMARY"
          echo "- ApiKeyId: $ApiKeyId" >> "$GITHUB_STEP_SUMMARY"
          echo "Read the API key value with: aws apigateway get-api-key --api-key $ApiKeyId --include-value --query value --output text" >> "$GITHUB_STEP_SUMMARY"